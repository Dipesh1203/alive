root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/server/main.go"
  entrypoint = "./tmp/main.exe"
  full_bin = ""
  args_bin = []
  include_ext = ["go", "tpl", "tmpl", "html", "env", "yaml", "yml", "toml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "docs", "db", "bin", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = "500ms"
  rerun = false
  rerun_delay = 500
  follow_symlink = false

  # Keep hooks empty by default for fast, reliable reloads.
  # Run code generators manually when needed.
  pre_cmd = []

[log]
  main_only = false
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true

[misc]
  clean_on_exit = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[proxy]
  enabled = false
  proxy_port = 0
  app_port = 0