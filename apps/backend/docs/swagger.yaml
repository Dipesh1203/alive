        type: string
      status:
        $ref: '#/definitions/db.WebsiteStatus'
      ticks:
        items:
          $ref: '#/definitions/db.WebsiteTicksModel'
        type: array
      updatedAt:
        type: string
      url:
        type: string
      websiteName:
        type: string
    type: object
  db.WebsiteStatus:
    enum:
    - Up
    - Down
    - Unknown
    type: string
    x-enum-varnames:
    - WebsiteStatusUp
    - WebsiteStatusDown
    - WebsiteStatusUnknown
  db.WebsiteTicksModel:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      latency:
        type: integer
      region:
        $ref: '#/definitions/db.RegionModel'
      upStatus:
        $ref: '#/definitions/db.WebsiteStatus'
      updatedAt:
        type: string
      website:
        $ref: '#/definitions/db.WebsiteModel'
      websiteId:
        type: string
      websiteRegionId:
        type: string
    type: object
  http.Cookie:
    properties:
      domain:
        description: optional
        type: string
      expires:
        description: optional
        type: string
      httpOnly:
        type: boolean
      maxAge:
        description: |-
          MaxAge=0 means no 'Max-Age' attribute specified.
          MaxAge<0 means delete cookie now, equivalently 'Max-Age: 0'
          MaxAge>0 means Max-Age attribute present and given in seconds
        type: integer
      name:
        type: string
      partitioned:
        type: boolean
      path:
        description: optional
        type: string
      quoted:
        description: indicates whether the Value was originally quoted
        type: boolean
      raw:
        type: string
      rawExpires:
        description: for reading cookies only
        type: string
      sameSite:
        $ref: '#/definitions/http.SameSite'
      secure:
        type: boolean
      unparsed:
        description: Raw text of unparsed attribute-value pairs
        items:
          type: string
        type: array
      value:
        type: string
    type: object
  http.Header:
    additionalProperties:
      items:
        type: string
      type: array
    type: object
  http.SameSite:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - SameSiteDefaultMode
    - SameSiteLaxMode
    - SameSiteStrictMode
    - SameSiteNoneMode
